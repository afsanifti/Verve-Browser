name: Build Verve APK (Alpha, Beta, Stable)

on:
  push:
    branches:
      - alpha
      - beta
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions: {}

jobs:
  build-apks:
    name: Build, Verify & Release Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_adblock

      - name: Compile native_adblock (.so libraries)
        working-directory: native_adblock
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Resolve Version Metadata
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RAW_VER="${TAG_NAME#v}"
            BASE_VER="${RAW_VER%%-*}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [[ "${RAW_VER}" == *"-alpha."* ]]; then
              NUM="${RAW_VER##*-alpha.}"
              NUM=$(( NUM > 49 ? 49 : (NUM < 1 ? 1 : NUM) ))
              STAGE_OFFSET=${NUM}
            elif [[ "${RAW_VER}" == *"-beta."* ]]; then
              NUM="${RAW_VER##*-beta.}"
              NUM=$(( NUM > 48 ? 48 : (NUM < 1 ? 1 : NUM) ))
              STAGE_OFFSET=$(( 50 + NUM ))
            else
              STAGE_OFFSET=99
            fi

            VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + STAGE_OFFSET ))
            VERSION_NAME="${RAW_VER}"
          else
            TAG_NAME=""
            VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_REF_NAME}"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Restore Release Signing Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/verve-release.keystore"
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"

          if [[ ! -s "${KEYSTORE_PATH}" ]]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepository=${{ github.repository }}

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/verve-release.keystore"

      # Stage E: Verify APK, extract actual metadata, compute SHA-256 & generate update.json
      - name: Verify Signed APK & Generate update.json
        id: package
        run: |
          set -euo pipefail

          RELEASE_DIR="release-apks"
          mkdir -p "${RELEASE_DIR}"

          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [[ -z "${RAW_APK}" || ! -s "${RAW_APK}" ]]; then
            echo "::error::Release APK was not generated or is empty."
            exit 1
          fi

          if [[ "${RAW_APK}" == *"unsigned"* ]]; then
            echo "::error::Generated APK is unsigned (${RAW_APK}). Aborting release."
            exit 1
          fi

          APK_ASSET_NAME="Verve-Browser.apk"
          FINAL_APK="${RELEASE_DIR}/${APK_ASSET_NAME}"
          cp "${RAW_APK}" "${FINAL_APK}"

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [[ -z "${APKSIGNER}" ]]; then
            echo "::error::apksigner not found in ANDROID_HOME/build-tools."
            exit 1
          fi
          "${APKSIGNER}" verify --print-certs "${FINAL_APK}"

          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [[ -z "${AAPT2}" ]]; then
            echo "::error::aapt2 not found in ANDROID_HOME/build-tools."
            exit 1
          fi

          BADGING=$("${AAPT2}" dump badging "${FINAL_APK}")
          ACTUAL_PACKAGE_NAME=$(echo "${BADGING}" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)
          ACTUAL_VERSION_CODE=$(echo "${BADGING}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          ACTUAL_VERSION_NAME=$(echo "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)

          if [[ "${ACTUAL_PACKAGE_NAME}" != "com.verve.browser" ]]; then
            echo "::error::Unexpected package name '${ACTUAL_PACKAGE_NAME}' (expected 'com.verve.browser')."
            exit 1
          fi

          if [[ ! "${ACTUAL_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Extracted invalid versionCode from APK: '${ACTUAL_VERSION_CODE}'"
            exit 1
          fi

          if [[ -z "${ACTUAL_VERSION_NAME}" ]]; then
            echo "::error::Extracted empty versionName from APK."
            exit 1
          fi

          SHA256_HASH=$(sha256sum "${FINAL_APK}" | awk '{print $1}')
          if [[ ! "${SHA256_HASH}" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Invalid SHA-256 checksum: '${SHA256_HASH}'"
            exit 1
          fi

          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          RELEASE_TAG="${TAG_NAME:-v${ACTUAL_VERSION_NAME}}"

          RELEASE_NOTES=""
          if [[ -n "${TAG_NAME}" ]] && git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            RELEASE_NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' | xargs -0 printf "%s" || true)
          fi

          if [[ -z "${RELEASE_NOTES// /}" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
            if [[ -n "${PREV_TAG}" ]]; then
              RELEASE_NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges || true)
            else
              RELEASE_NOTES=$(git log -n 10 --pretty=format:"- %s" --no-merges || true)
            fi
          fi

          if [[ -z "${RELEASE_NOTES// /}" ]]; then
            RELEASE_NOTES="Verve Browser ${ACTUAL_VERSION_NAME} release"
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf "%s\n" "${RELEASE_NOTES}" > "${NOTES_FILE}"

          MANIFEST_PATH="${RELEASE_DIR}/update.json"
          jq -n \
            --argjson versionCode "${ACTUAL_VERSION_CODE}" \
            --arg versionName "${ACTUAL_VERSION_NAME}" \
            --arg apkAssetName "${APK_ASSET_NAME}" \
            --arg sha256 "${SHA256_HASH}" \
            --arg releaseNotes "${RELEASE_NOTES}" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkAssetName: $apkAssetName,
              sha256: $sha256,
              releaseNotes: $releaseNotes
            }' > "${MANIFEST_PATH}"

          jq -e '
            (.versionCode | type == "number" and . > 0) and
            (.versionName | type == "string" and length > 0) and
            (.apkAssetName | type == "string" and length > 0) and
            (.sha256 | type == "string" and test("^[a-fA-F0-9]{64}$")) and
            (.releaseNotes | type == "string" and length > 0)
          ' "${MANIFEST_PATH}" > /dev/null || {
            echo "::error::update.json failed schema validation."
            cat "${MANIFEST_PATH}"
            exit 1
          }

          MANIFEST_ASSET=$(jq -r '.apkAssetName' "${MANIFEST_PATH}")
          if [[ ! -s "${RELEASE_DIR}/${MANIFEST_ASSET}" ]]; then
            echo "::error::apkAssetName '${MANIFEST_ASSET}' does not match staged APK."
            exit 1
          fi

          echo "apk_path=${FINAL_APK}" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${MANIFEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK & Manifest as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: verve-apk-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.manifest_path }}
          if-no-files-found: error

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
          NOTES_FILE: ${{ steps.package.outputs.notes_file }}
        run: |
          set -euo pipefail

          if [[ ! -s "${APK_PATH}" || ! -s "${MANIFEST_PATH}" ]]; then
            echo "::error::Missing Verve-Browser.apk or update.json prior to publishing release."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${APK_PATH}" \
              "${MANIFEST_PATH}" \
              --clobber

            gh release edit "${RELEASE_TAG}" \
              --title "Verve ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              "${APK_PATH}" \
              "${MANIFEST_PATH}" \
              --title "Verve ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag \
              --draft=false \
              --prerelease=false \
              --latest
          fi

      # Stage F: Post-publish validation of the live public GitHub Release
      - name: Validate Published GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          set -euo pipefail

          EXPECTED_PACKAGE="com.verve.browser"
          EXPECTED_APK_ASSET="Verve-Browser.apk"
          VERIFY_DIR="${RUNNER_TEMP}/release-validation"
          mkdir -p "${VERIFY_DIR}"

          API_URL="https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}"
          RELEASE_JSON="${VERIFY_DIR}/release.json"

          FETCHED=false
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -L -w "%{http_code}" -o "${RELEASE_JSON}" \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}")
            if [[ "${HTTP_CODE}" == "200" ]]; then
              FETCHED=true
              break
            fi
            echo "Attempt ${attempt}: API returned HTTP ${HTTP_CODE}, retrying in 4s..."
            sleep 4
          done

          if [[ "${FETCHED}" != "true" ]]; then
            echo "::error::Release '${RELEASE_TAG}' not found or not publicly accessible (HTTP ${HTTP_CODE})."
            exit 1
          fi

          if [[ "$(jq -r '.draft' "${RELEASE_JSON}")" != "false" ]]; then
            echo "::error::Release '${RELEASE_TAG}' is marked as draft."
            exit 1
          fi

          APK_DOWNLOAD_URL=$(jq -r --arg name "${EXPECTED_APK_ASSET}" '.assets[] | select(.name == $name) | .browser_download_url' "${RELEASE_JSON}")
          MANIFEST_DOWNLOAD_URL=$(jq -r '.assets[] | select(.name == "update.json") | .browser_download_url' "${RELEASE_JSON}")

          if [[ -z "${APK_DOWNLOAD_URL}" || -z "${MANIFEST_DOWNLOAD_URL}" ]]; then
            echo "::error::Missing required release assets (${EXPECTED_APK_ASSET} or update.json)."
            exit 1
          fi

          DOWNLOADED_MANIFEST="${VERIFY_DIR}/update.json"
          DOWNLOADED_APK="${VERIFY_DIR}/${EXPECTED_APK_ASSET}"

          MANIFEST_HTTP=$(curl -sS -L -w "%{http_code}" -o "${DOWNLOADED_MANIFEST}" "${MANIFEST_DOWNLOAD_URL}")
          if [[ "${MANIFEST_HTTP}" != "200" || ! -s "${DOWNLOADED_MANIFEST}" ]]; then
            echo "::error::Public download of update.json failed (HTTP ${MANIFEST_HTTP})."
            exit 1
          fi

          APK_HTTP=$(curl -sS -L -w "%{http_code}" -o "${DOWNLOADED_APK}" "${APK_DOWNLOAD_URL}")
          if [[ "${APK_HTTP}" != "200" || ! -s "${DOWNLOADED_APK}" ]]; then
            echo "::error::Public download of ${EXPECTED_APK_ASSET} failed (HTTP ${APK_HTTP})."
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "${APKSIGNER}" verify --print-certs "${DOWNLOADED_APK}"

          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          BADGING=$("${AAPT2}" dump badging "${DOWNLOADED_APK}")
          APK_PACKAGE=$(echo "${BADGING}" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)
          APK_VERSION_CODE=$(echo "${BADGING}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)

          if [[ "${APK_PACKAGE}" != "${EXPECTED_PACKAGE}" ]]; then
            echo "::error::APK package '${APK_PACKAGE}' != '${EXPECTED_PACKAGE}'."
            exit 1
          fi

          MANIFEST_VERSION_CODE=$(jq -r '.versionCode' "${DOWNLOADED_MANIFEST}")
          if [[ "${APK_VERSION_CODE}" != "${MANIFEST_VERSION_CODE}" ]]; then
            echo "::error::APK versionCode (${APK_VERSION_CODE}) != update.json (${MANIFEST_VERSION_CODE})."
            exit 1
          fi

          ACTUAL_SHA256=$(sha256sum "${DOWNLOADED_APK}" | awk '{print $1}')
          MANIFEST_SHA256=$(jq -r '.sha256' "${DOWNLOADED_MANIFEST}")
          if [[ "${ACTUAL_SHA256,,}" != "${MANIFEST_SHA256,,}" ]]; then
            echo "::error::APK SHA-256 (${ACTUAL_SHA256}) != update.json (${MANIFEST_SHA256})."
            exit 1
          fi

          echo "All Stage F validation checks passed for ${RELEASE_TAG}."